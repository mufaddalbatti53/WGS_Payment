<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | WGS Payment Tracker</title>
    <meta name="description" content="The requested page could not be found on WGS Payment Tracker.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="404 — Page Not Found | WGS Payment Tracker">
    <meta property="og:description" content="The requested page could not be found on WGS Payment Tracker.">
    <meta property="og:image" content="https://payment.webgraphicsstudio.in/images/dashboard-demo.jpg">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/images/WGS.png" type="image/png">
    <link rel="apple-touch-icon" href="/images/WGS.png">
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --primary: #27ae60;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg-color: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .error-card {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 12px;
        }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
        .btn-home {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(39, 174, 96, 0.3); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page or resource you requested could not be found. It may have been moved or deleted.</p>
        <a href="index.html" class="btn-home">← Back to Home</a>
    </div>
</body>
</html>
